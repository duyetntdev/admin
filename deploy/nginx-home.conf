# duyetnt.com → trang chủ tĩnh /var/www/duyetnt-home (admin/homepage/index.html).
# Chứng chỉ do certbot cấp sẵn ở /etc/letsencrypt/live/duyetnt.com.
server {
    server_name duyetnt.com www.duyetnt.com;
    root /var/www/duyetnt-home;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }
    location / {
        try_files $uri =404;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/duyetnt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duyetnt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name duyetnt.com www.duyetnt.com;
    return 301 https://$host$request_uri;
}
