# admin.duyetnt.com → server/admin.py (127.0.0.1:8095). Cổng 8096 (nhận sự kiện) KHÔNG được đưa ra đây.
# certbot --nginx sẽ tự thêm phần listen 443 / chứng chỉ vào file này.
server {
    listen 80;
    listen [::]:80;
    server_name admin.duyetnt.com;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        auth_basic "admin.duyetnt.com";
        auth_basic_user_file /etc/nginx/duyetnt-admin.htpasswd;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        limit_except GET { deny all; }
    }
}
